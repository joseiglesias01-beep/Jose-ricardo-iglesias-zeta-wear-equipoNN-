<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Prueba</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --border-color: #007bff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            --bg-color: #1e1e2e;
            --card-bg: #2a2a3c;
            --text-color: #ffffff;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #3b82f6;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            max-width: 500px;
            width: 90%;
            text-align: center;
            transition: background-color 0.3s;
        }

        h1 {
            margin-top: 0;
            color: var(--primary-color);
        }

        p {
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            background-color: transparent;
            color: var(--text-color);
            border: 2px solid var(--border-color);
        }

        .secondary-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .counter-box {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 1rem 0;
            padding: 10px;
            border-radius: 6px;
            background-color: rgba(128, 128, 128, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>¡Página de Prueba!</h1>
        <p>Esta es una página web de prueba construida con HTML5, CSS3 y JavaScript interactivo.</p>

        <div class="counter-box">
            Contador: <span id="counter">0</span>
        </div>

        <div class="button-group">
            <button id="increment-btn">Incrementar</button>
            <button id="reset-btn" class="secondary-btn">Reiniciar</button>
        </div>

        <button id="theme-btn" class="secondary-btn">Cambiar a Modo Oscuro</button>
    </div>

    <script>
        let count = 0;
        const counterEl = document.getElementById('counter');
        const incrementBtn = document.getElementById('increment-btn');
        const resetBtn = document.getElementById('reset-btn');
        const themeBtn = document.getElementById('theme-btn');

        incrementBtn.addEventListener('click', () => {
            count++;
            counterEl.textContent = count;
        });

        resetBtn.addEventListener('click', () => {
            count = 0;
            counterEl.textContent = count;
        });

        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                themeBtn.textContent = 'Cambiar a Modo Claro';
            } else {
                themeBtn.textContent = 'Cambiar a Modo Oscuro';
            }
        });
    </script>
</body>
</html>
